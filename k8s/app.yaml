apiVersion: apps/v1
kind: Deployment
metadata:
  name: naguabo-app
  namespace: naguabo-commercial
  labels:
    app: naguabo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: naguabo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: naguabo-app
    spec:
      containers:
        - name: app
          image: naguabo/commercial-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: naguabo-config
            - secretRef:
                name: naguabo-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: naguabo-app
  namespace: naguabo-commercial
spec:
  selector:
    app: naguabo-app
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naguabo-ingress
  namespace: naguabo-commercial
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - naguabo-commercial.com
        - www.naguabo-commercial.com
      secretName: naguabo-tls
  rules:
    - host: naguabo-commercial.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naguabo-app
                port:
                  number: 80
    - host: www.naguabo-commercial.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naguabo-app
                port:
                  number: 80
